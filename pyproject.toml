[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deckard"
version = "0.2.0"
description = "Gestor de bancos de ejercicios prácticos, guías y graduación para cátedras de C."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0,<3.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/deckard"
Repository = "https://github.com/INGCOM-UNRN-P1/deckard.git"
Issues = "https://github.com/INGCOM-UNRN-P1/deckard/issues"

[project.scripts]
deckard = "deckard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deckard"]

[dependency-groups]
dev = ["pytest>=8.0"]
