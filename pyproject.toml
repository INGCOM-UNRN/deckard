[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deckard"
version = "0.2.0"
description = "Gestor de bancos de ejercicios prácticos, guías y graduación para cátedras de C."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0,<3.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    # Núcleo común del ecosistema (N-ECO-14): TyperConErrores y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@cf49348fae40d264006fe07dee2cc9e88dd9c934",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@18f9c3b3527d16d152d56e918160bc772ac9990c",
    "nostromo @ git+https://github.com/INGCOM-UNRN-P1/nostromo@c4c3bfcfdf709de9f3892e503ae2f208bf166f51",
]

# Revisión ortográfica con LanguageTool (delegada en myst-tools).
languagetool = [
    "myst-tools @ git+https://github.com/martinvilu/mystmd-tools@ce716491213a5b0c0e36ea08dfb3c31b7794d478",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN/deckard"
Repository = "https://github.com/INGCOM-UNRN/deckard.git"
Issues = "https://github.com/INGCOM-UNRN/deckard/issues"

[project.scripts]
deckard = "deckard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deckard"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true
