[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deckard"
version = "0.2.0"
description = "Gestor de bancos de ejercicios prácticos, guías y graduación para cátedras de C."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.0,<3.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "weasyprint>=60.0",
    # Núcleo común del ecosistema (N-ECO-14): TyperConErrores y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN-P1/yutani@6f95ad93c661adb4493414c6cc57534a18e8f2e0",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@3c0f0622e3a4892d0fc479c6854b6a2d943d4b9b",
    "nostromo @ git+https://github.com/INGCOM-UNRN-P1/nostromo@29589a02489342b616afd1ff27284c3cf55c26f1",
]

# Revisión ortográfica con LanguageTool (delegada en myst-tools).
# deckard improve con Gemini o Claude (yutani.ia); con un servidor local u OpenCode no hace falta.
ai = [
    "google-genai>=2.4.0",
    "anthropic>=1.11.0",
]

languagetool = [
    "myst-tools @ git+https://github.com/martinvilu/mystmd-tools@1e7c3fdc4436c24ac369ad0d8b90a969a5ea8f5b",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN/deckard"
Repository = "https://github.com/INGCOM-UNRN/deckard.git"
Issues = "https://github.com/INGCOM-UNRN/deckard/issues"

[project.scripts]
deckard = "deckard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deckard"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true

[tool.mypy]
# Tipos del paquete (N-ECO-08): `uv run --with mypy mypy`, igual que el CI.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
